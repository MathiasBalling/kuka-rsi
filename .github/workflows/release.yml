# Publishes both packages when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup before the first tag:
# - PyPI: add a "pending trusted publisher" for project kuka-rsi
#   (owner MathiasBalling, repository kuka-rsi, workflow release.yml, environment pypi).
# - crates.io: create an API token with the publish-new and publish-update scopes and store
#   it as the repository secret CARGO_REGISTRY_TOKEN.
# - GitHub: create the environments "pypi" and "crates-io" (Settings > Environments); add
#   required reviewers there to approve each release by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds everything, publishes nothing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag, version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kuka-rsi") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the Cargo version $version" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - run: cargo test --workspace --features kuka-rsi/cli
      - run: cargo publish -p kuka-rsi --dry-run

  linux:
    name: Wheel linux-${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kuka-rsi-py
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: crates/kuka-rsi-py/dist

  macos:
    name: Wheel macos-${{ matrix.target }}
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kuka-rsi-py
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target }}
          path: crates/kuka-rsi-py/dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kuka-rsi-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/kuka-rsi-py/dist

  smoke:
    name: Install the wheel (${{ matrix.os }})
    needs: [linux, macos]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist kuka-rsi
          python -m kuka_rsi.controller robot_files
          python -c "import kuka_rsi; kuka_rsi.Driver('robot_files/kuka_rsi_ethernet.xml', bind='127.0.0.1:0', rt_priority=False).close()"

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kuka-rsi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/kuka-rsi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p kuka-rsi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [pypi, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
