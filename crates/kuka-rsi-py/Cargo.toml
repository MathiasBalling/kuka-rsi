[package]
name = "kuka-rsi-py"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
kuka-rsi = { path = "../kuka-rsi" }
# abi3-py310: one wheel per platform works on every CPython from 3.10 on.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
pyo3-log = "0.13"

[build-dependencies]
pyo3-build-config = "0.29"
