[project]
name = "kuka-rsi"
dynamic = ["version"]
description = "KUKA RSI 5.0 driver: joint streaming over the 4 ms UDP cycle (Rust core)"
authors = [{ name = "Mathias Balling", email = "math260r@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-FZI"]
keywords = ["kuka", "rsi", "robotics", "robot", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/MathiasBalling/kuka-rsi"
Issues = "https://github.com/MathiasBalling/kuka-rsi/issues"
Changelog = "https://github.com/MathiasBalling/kuka-rsi/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "kuka_rsi._core"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["pytest>=8"]
